[package]
name = "scalpel"
version = "1.0.0"
edition = "2021"
authors = ["Scalpel Contributors"]
description = "Surgical precision for Linux kernel observability and modification"
license = "MIT"
repository = "https://github.com/mnhcorp/scalpel"
keywords = ["ebpf", "kernel", "observability", "cli", "agentic"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive", "cargo"] }

# TUI framework (Claude Code aesthetic)
ratatui = "0.28"
crossterm = "0.28"

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP client for Claude API
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System interaction
nix = { version = "0.29", features = ["process", "signal"] }
procfs = "0.16"

# Color output
colored = "2.1"

# Configuration
dirs = "5.0"
toml = "0.8"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
lazy_static = "1.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "scalpel"
path = "src/main.rs"
